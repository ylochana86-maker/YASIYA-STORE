
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN YASIYA FF PANEL</title>
<style>
body{margin:0;background:#09090d;color:white;font-family:Arial;text-align:center}
header{padding:25px;background:#171019;border-bottom:2px solid red}
h1{color:red}
.container{padding:20px;max-width:600px;margin:auto}
.card{background:#191922;border:1px solid #ff303d;border-radius:15px;padding:20px;margin:15px 0}
button{background:#ff303d;color:white;border:0;padding:13px 20px;border-radius:10px;font-weight:bold}
input{width:100%;accent-color:red}
.value{color:#ff5963}
</style>
</head>
<body>
<header>
<h1>ADMIN YASIYA</h1>
<p>FF HEADSHOT PANEL</p>
</header>
<div class="container">
<div class="card">
<h2>🎯 SENSITIVITY SETTINGS</h2>
<div id="settings"></div>
<button onclick="reset()">RESET SETTINGS</button>
</div>
<div class="card">
<h2>🎮 HUD GUIDE</h2>
<p>Fire Button - Comfortable Position</p>
<p>Scope - Easy Access</p>
<p>Joystick - Smooth Movement</p>
</div>
<div class="card">
<h2>🔥 HEADSHOT TRAINING</h2>
<p>Practice your aim and crosshair control.</p>
<button onclick="alert('Keep practicing!')">START PRACTICE</button>
</div>
</div>
<script>
const defaults=[
["General",95],
["Red Dot",90],
["2x Scope",85],
["4x Scope",75],
["Sniper Scope",50],
["Free Look",70]
];
function load(){
let html="";
defaults.forEach((s,i)=>{
html+=`<p>${s[0]}: <span class="value" id="v${i}">${s[1]}</span></p>
<input type="range" min="0" max="100" value="${s[1]}" oninput="document.getElementById('v${i}').innerText=this.value">`;
});
document.getElementById("settings").innerHTML=html;
}
function reset(){load()}
load();
</script>
</body>
</html>
